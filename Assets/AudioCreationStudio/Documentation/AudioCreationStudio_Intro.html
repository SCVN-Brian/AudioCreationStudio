<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Audio Creation Studio Intro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column (max 1040px); five required sections in order, each opened by its number + label.
   Palette follows the tool's own tokens (accent blue, slate neutrals), light first with a matching dark theme. */
:root{
  --bg:#F5F7FA; --paper:#FFFFFF; --ink:#141922; --dim:#566070; --faint:#8A93A3; --line:#E1E5EC;
  --accent:#2F6FE0; --accent-soft:#E7EFFD; --warn:#B26B00; --warn-soft:#FDF2E2; --ok:#16855F; --ok-soft:#E3F4ED;
  --shot-frame:#15181E;
  --f-ui:"Inter","Noto Sans KR",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1217; --paper:#171B22; --ink:#E8ECF2; --dim:#9CA6B5; --faint:#6B7484; --line:#283040;
  --accent:#5B9DFF; --accent-soft:rgba(91,157,255,.14); --warn:#F0B35A; --warn-soft:rgba(240,179,90,.12); --ok:#42C9A0; --ok-soft:rgba(66,201,160,.12);
  --shot-frame:#0A0C10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1217; --paper:#171B22; --ink:#E8ECF2; --dim:#9CA6B5; --faint:#6B7484; --line:#283040;
  --accent:#5B9DFF; --accent-soft:rgba(91,157,255,.14); --warn:#F0B35A; --warn-soft:rgba(240,179,90,.12); --ok:#42C9A0; --ok-soft:rgba(66,201,160,.12);
  --shot-frame:#0A0C10; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:36px 64px}
:lang(ko) body{word-break:keep-all}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:56px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.eyebrow{font:500 12px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.lang{display:flex;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:2px}
.lang button{height:28px;padding:0 12px;border-radius:6px;font-size:13px;color:var(--dim)}
.lang button.on{background:var(--accent);color:#fff;font-weight:600}
header.hero{display:flex;flex-direction:column;gap:18px}
.hero h1{font-size:clamp(34px,5vw,54px);line-height:1.05;font-weight:700;margin-top:14px}
.hero .lede{font-size:clamp(16px,1.6vw,19px);color:var(--dim);max-width:62ch}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 12.5px/1 var(--f-ui);padding:7px 10px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--dim)}
.chip b{color:var(--ink);font-weight:600}

/* sections */
section{display:flex;flex-direction:column;gap:20px}
.sh{display:flex;align-items:baseline;gap:14px;border-top:1px solid var(--line);padding-top:22px}
.sh .n{font:500 13px/1 var(--f-mono);color:var(--accent);flex:none}
.sh h2{font-size:24px;font-weight:700}
.sh p{margin-left:auto;color:var(--faint);font-size:13px;text-align:right}

/* screenshots */
.shot{background:var(--shot-frame);border-radius:12px;padding:10px;box-shadow:0 20px 50px -24px rgba(10,20,40,.45)}
.shot img{display:block;width:100%;height:auto;border-radius:6px;aspect-ratio:1512/800;object-fit:cover;background:#15181E}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{height:32px;padding:0 13px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:13.5px;color:var(--dim)}
.tabs button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
.cap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:baseline}
.cap p{color:var(--ink);max-width:70ch}
.note{font-size:13px;color:var(--faint)}
.cta{font-weight:600;text-decoration:none;white-space:nowrap}
.cta:hover{text-decoration:underline}

/* problem */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pcard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pcard .k{font:500 12px/1 var(--f-mono);color:var(--warn)}
.pcard h3{font-size:16.5px;font-weight:600}
.pcard p{color:var(--dim);font-size:14.5px}

/* solution */
.lead{max-width:72ch;color:var(--dim)}
.lead b{color:var(--ink)}
.flow{display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:0;list-style:none}
.flow li{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.flow li+li::before{content:"→";color:var(--faint)}
.tbl{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14.5px}
th{font:600 11.5px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:left;padding:14px 18px;border-bottom:1px solid var(--line)}
td{padding:16px 18px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600;width:24%}
td:first-child span{display:block;font:500 12px/1.4 var(--f-mono);color:var(--warn);margin-bottom:4px}
td:nth-child(2){color:var(--dim)}
td:last-child{white-space:nowrap}
.ws{display:inline-block;font:500 12px/1 var(--f-ui);padding:5px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin:0 4px 4px 0}

/* impact */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat b{font:600 28px/1.1 var(--f-ui);letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--dim)}
.calc{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px}
.calc h3{font-size:16.5px;font-weight:600}
.calc .assume{display:inline-block;margin-top:6px;font-size:12.5px;color:var(--warn);background:var(--warn-soft);padding:6px 9px;border-radius:6px}
.fields{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.field{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:12px;align-items:center;font-size:14px;color:var(--dim)}
.field input{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:0 10px;font:500 15px var(--f-mono);text-align:right}
.field input:focus{outline:none;border-color:var(--accent)}
.out{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-content:center}
.out div{background:var(--ok-soft);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px}
.out b{font:600 26px/1.1 var(--f-mono);color:var(--ok)}
.out span{font-size:12.5px;color:var(--dim)}
.out p{grid-column:1/-1;font-size:12.5px;color:var(--faint)}
.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--dim);max-width:78ch}
.list b{color:var(--ink);font-weight:600}

/* resources */
.res{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.rcard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rcard .lbl{font:600 11.5px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.rcard h3{font-size:16px;font-weight:600}
.rcard h3.ok{color:var(--ok)}
.rcard h3.warn{color:var(--warn)}
.rcard p{font-size:14px;color:var(--dim)}
.badge{align-self:flex-start;font:600 11.5px/1 var(--f-ui);padding:5px 8px;border-radius:6px}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.limits{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px}
.limits h3{font-size:16.5px;font-weight:600}
.next{font-size:14px;color:var(--dim)}
.next b{color:var(--ink)}
footer{color:var(--faint);font-size:13px;border-top:1px solid var(--line);padding-top:18px}

@media (max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.res{grid-template-columns:repeat(2,minmax(0,1fr))}.calc{grid-template-columns:1fr}}
@media (max-width:620px){.grid2,.res{grid-template-columns:1fr}.sh{flex-wrap:wrap}.sh p{margin-left:0;text-align:left;width:100%}.out{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style>

<div class="wrap">
  <header class="hero">
    <div class="top">
      <span class="eyebrow" data-i18n="eyebrow"></span>
      <div class="lang" id="langSw" role="group" aria-label="Language"><button data-lang="en" lang="en">English</button><button data-lang="ko" lang="ko">한국어</button><button data-lang="vi" lang="vi">Tiếng Việt</button></div>

  <!-- 1 -->

  <!-- 3 -->
  <section id="solution">

    <div class="tbl"><table><thead><tr><th data-i18n="s3.c1"></th><th data-i18n="s3.c2"></th><th>Workspace</th></tr></thead><tbody id="solRows"></tbody></table></div>
  </section>

  <!-- 4 -->
  <section id="impact">
    <div class="sh"><span class="n">04</span><h2 data-i18n="s4.t"></h2><p data-i18n="s4.s"></p></div>
    <div class="stats" id="stats"></div>
    <div class="calc">
      <div>

        </div>
      </div>
      <div class="out">
        <div><b id="oM">48</b><span data-i18n="calc.month"></span></div>

        <p data-i18n="calc.foot"></p>
      </div>
    </div>
    <ul class="list" id="benefits"></ul>
  </section>

  <!-- 5 -->
  <section id="limits">
    <div class="sh"><span class="n">05</span><h2 data-i18n="s5.t"></h2><p data-i18n="s5.s"></p></div>
    <div class="res" id="res"></div>
    <div class="limits">
      <h3 data-i18n="lim.t"></h3>
      <ul class="list" id="limList"></ul>
      <p class="next" data-i18n="lim.next"></p>

  <footer data-i18n="foot"></footer>
</div>

en: {
  eyebrow: "Service introduction · Unity Editor tool",
  lede: "A mini DAW inside the Unity Editor that lets the team make, edit and export game sound effects without leaving Unity or opening separate audio software.",
  "chip.pkg": "UPM package · <b>pure C#</b>", "chip.owner": "Owner: <b>Brian</b>",
  "s1.t": "Service screenshots", "s1.s": "Captured from the real tool in Unity",
  "s1.mock": "Open the interactive mockup (all 7 v1.3 tabs) →",
  "s1.note": "Screenshots are from v1.2. In v1.3 the Generator tab was split into AI Generate (with the AI Sound Analyzer and Take Library) and Custom Generate.",
  shots: ["Arrange: the Saw Machine demo with 4 layers, fades, Track Gain automation, the Inspector and the Effects Rack.", "Mixer: one channel strip per track with its effect chain; the master has a Compressor and a Limiter.", "Generator: the ElevenLabs AI form, generated takes and synth parameters on the right.", "Loop: START/END markers, raw cut vs crossfade, and Boundary Analysis reporting Click → Seamless.", "Variations: random ranges, 5 variations with waveforms, A/B, save and batch export.", "Library: 18 generator, effect, effect-chain and export-settings presets, each loaded with one button."],
  "s2.t": "Problem", "s2.s": "What the team runs into when making SFX",
  problems: [
    ["Every SFX tweak is a round trip out of Unity", "Changing a sound's length, fade or level means opening a separate DAW, exporting, re-importing into Unity and testing in the game again. Even a small change takes many steps."],
    ["Dependence on people with audio skills", "Developers and artists have no tool to make or adjust SFX themselves, so every request waits for a sound designer or a search through ready-made asset packs."],
    ["Loops and variations are hard by hand", "A running machine needs a loop with no click at the seam; a coin pickup played hundreds of times needs variations so it doesn't wear thin. By hand this is slow and hard to reproduce."],
    ["AI-generated SFX live outside the pipeline", "AI sound tools produce raw files outside the project, good prompts are hard to write, and takes aren't kept alongside the game's assets."]],
  "s3.t": "Solution", "s3.s": "How the tool answers each problem",
  "s3.lead": "The whole SFX workflow lives in <b>one window inside Unity</b>. Every edit is stored in an <b>Audio Recipe</b> (ScriptableObject) without touching the source files, so a sound can be reopened and changed at any time.",
  "s3.c1": "Problem", "s3.c2": "In the tool",
  sol: [
    "Multitrack timeline, mixer, 9 effects and export right inside Unity; exported files are imported automatically. Press Space to hear a change, even mid-playback.",
    "A procedural synth with 11 presets (Coin Pickup, UI Click, Impact…), a preset Library shared through git, and recipes that reopen for editing. People without audio skills can make basic SFX.",
    "The Loop Editor snaps to zero crossings, crossfades and reports Click → Seamless. Variations creates seeded variants (same seed, same result) and batch-exports them.",
    "Describe the sound in Vietnamese or English; AI turns it into 9 parameters and builds the ElevenLabs prompt. Takes are saved in the Take Library (real folders in the project) and open in Custom Generate, Loop, or straight on the timeline."],
  "s4.t": "Expected impact", "s4.s": "Measured from the tool, plus an estimate for the team",
  stats: [["~5 min", "to make a first SFX with the standard workflow (QuickStart)"], ["0", "servers, infrastructure cost or external libraries"], ["1 line", "in manifest.json to install into any project"], ["5", "export formats: WAV, AIFF, FLAC, MP3, OGG"], ["98", "EditMode tests for DSP, effects, loops, export, AI client"]],
  "calc.t": "Estimated time saved", "calc.assume": "The defaults are example assumptions, not measurements. Enter your team's numbers for a closer estimate.",
  "calc.n": "SFX made or changed per month", "calc.before": "Hours per SFX today (incl. round trips and waiting)", "calc.after": "Hours per SFX with the tool",
  "calc.month": "hours saved / month", "calc.year": "hours saved / year", "calc.faster": "faster per SFX", "calc.foot": "= SFX count × (hours today − hours with the tool). ElevenLabs credits for AI takes are not included.",
  benefits: ["<b>Less dependence:</b> developers and artists handle simple SFX requests themselves; sound designers focus on the sounds that matter.", "<b>Editable later:</b> recipes store how a sound is built, so it can be changed months later instead of being redone.", "<b>Less repetition:</b> seamless loops and variations take minutes.", "<b>Consistency:</b> presets and recipes are shared across games through git."],
  "s5.t": "Limitations and resources", "s5.s": "Server, data, integrations, infrastructure",
  res: [
    ["Server", "None needed", "ok", "The tool runs entirely in the Unity Editor on each person's machine. Rendering and encoding run on local worker threads."],
    ["Data", "Stays in the project", "ok", "Recipes, presets, takes and exports are assets managed in git like any other. API keys live only in each machine's EditorPrefs. Apart from prompts sent to Gemini/ElevenLabs when using AI, no data leaves the machine."],
    ["Integrations", "Optional, paid", "warn", "ElevenLabs Sound Effects API: needs internet and an API key; each take uses plan credits and usage rights follow the plan's terms. Google Gemini (free key, default) or OpenAI for the AI Sound Analyzer. ffmpeg for MP3/OGG export."],
    ["Infrastructure", "Unity 2022.3+", "ok", "Installed through UPM with a git URL to the GitHub repo SCVN-Brian/AudioCreationStudio. No package dependencies beyond Unity's built-in modules (UI Toolkit, Audio)."]],
  "lim.t": "Current limitations",
  limits: ["Verified on Unity 2022.3.19f1 / macOS. <b>Windows, Linux and Unity 6 are untested.</b>", "Suited to short SFX (seconds to about a minute). Preview renders the whole mix offline, capped at 10 minutes.", "Pitch variation is varispeed (pitch and length change together); there is no time-stretching. Generator voices are mono.", "No oversampling in Distortion; no lookahead in the Limiter.", "MP3/OGG/AIFF/FLAC sources need Load Type = Decompress On Load.", "Unity ignores the <span class=\"mono\">smpl</span> loop chunk, so Loop must be enabled on the AudioSource (Wwise and FMOD read it).", "ElevenLabs accepts text only; a reference only affects duration and a text hint.", "Timeline drag gestures were tested by hand and through undo/command tests; there are no automated UI tests."],
  "lim.next": "<b>Possible next steps:</b> time-stretching, oversampling for Distortion, lookahead for the Limiter, Windows and Unity 6 support.",
  foot: "Sources: the README, the v1.3.0 CHANGELOG and the Documentation/ folder of the com.supercent.audiocreationstudio package."

  $("#problems").innerHTML = L.problems.map(([h, p], i) => `<article class="pcard"><span class="k">P${i + 1}</span><h3>${h}</h3><p>${p}</p></article>`).join("");
  $("#solRows").innerHTML = L.sol.map((s, i) => `<tr><td><span>P${i + 1}</span>${L.problems[i][0]}</td><td>${s}</td><td>${SOL_WS[i].map(w => `<span class="ws">${w}</span>`).join("")}</td></tr>`).join("");
  $("#stats").innerHTML = L.stats.map(([v, d]) => `<div class="stat"><b>${v}</b><span>${d}</span></div>`).join("");
  $("#benefits").innerHTML = L.benefits.map(x => `<li>${x}</li>`).join("");
  $("#res").innerHTML = L.res.map(([k, h, tone, p]) => `<article class="rcard"><span class="lbl">${k}</span><h3 class="${tone}">${tone === "ok" ? "✓" : "!"} ${h}</h3><p>${p}</p></article>`).join("");
  $("#limList").innerHTML = L.limits.map(x => `<li>${x}</li>`).join("");
  showShot(shot); calc();
}
$("#shotTabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) showShot([...b.parentElement.children].indexOf(b)); });
$("#langSw").addEventListener("click", e => { const b = e.target.closest("[data-lang]"); if (!b) return; lang = b.dataset.lang; try { localStorage.setItem("acs-intro-lang", lang); } catch (er) {} render(); });
["#cN", "#cB", "#cA"].forEach(id => $(id).addEventListener("input", calc));
render();
</script>

</body>
</html>
